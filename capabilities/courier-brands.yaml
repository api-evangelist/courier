naftiko: 1.0.0-alpha2
info:
  label: Courier — Brands
  description: 'Courier — Brands. 5 operations. Lead operation: Create a new brand. Self-contained Naftiko capability covering
    one Courier business surface.'
  tags:
  - Courier
  - Brands
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COURIER_API_KEY: COURIER_API_KEY
capability:
  consumes:
  - type: http
    namespace: courier-brands
    baseUri: https://api.courier.com
    description: Courier — Brands business capability. Self-contained, no shared references.
    resources:
    - name: brands
      path: /brands
      operations:
      - name: brandscreate
        method: POST
        description: Create a new brand
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: brandslist
        method: GET
        description: List brands
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cursor
          in: query
          type: string
          description: A unique identifier that allows for fetching the next set of brands.
    - name: brands-brand_id
      path: /brands/{brand_id}
      operations:
      - name: brandsget
        method: GET
        description: Get a brand
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: brand_id
          in: path
          type: string
          description: A unique identifier associated with the brand you wish to retrieve.
          required: true
      - name: brandsreplace
        method: PUT
        description: Replace a brand
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: brand_id
          in: path
          type: string
          description: A unique identifier associated with the brand you wish to update.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: brandsdelete
        method: DELETE
        description: Delete a brand
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: brand_id
          in: path
          type: string
          description: A unique identifier associated with the brand you wish to retrieve.
          required: true
    authentication:
      type: bearer
      token: '{{env.COURIER_API_KEY}}'
  exposes:
  - type: rest
    namespace: courier-brands-rest
    port: 8080
    description: REST adapter for Courier — Brands. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/brands
      name: brands
      description: REST surface for brands.
      operations:
      - method: POST
        name: brandscreate
        description: Create a new brand
        call: courier-brands.brandscreate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: brandslist
        description: List brands
        call: courier-brands.brandslist
        with:
          cursor: rest.cursor
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/brands/{brand-id}
      name: brands-brand-id
      description: REST surface for brands-brand_id.
      operations:
      - method: GET
        name: brandsget
        description: Get a brand
        call: courier-brands.brandsget
        with:
          brand_id: rest.brand_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: brandsreplace
        description: Replace a brand
        call: courier-brands.brandsreplace
        with:
          brand_id: rest.brand_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: brandsdelete
        description: Delete a brand
        call: courier-brands.brandsdelete
        with:
          brand_id: rest.brand_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: courier-brands-mcp
    port: 9090
    transport: http
    description: MCP adapter for Courier — Brands. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-new-brand
      description: Create a new brand
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: courier-brands.brandscreate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-brands
      description: List brands
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: courier-brands.brandslist
      with:
        cursor: tools.cursor
      outputParameters:
      - type: object
        mapping: $.
    - name: get-brand
      description: Get a brand
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: courier-brands.brandsget
      with:
        brand_id: tools.brand_id
      outputParameters:
      - type: object
        mapping: $.
    - name: replace-brand
      description: Replace a brand
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: courier-brands.brandsreplace
      with:
        brand_id: tools.brand_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-brand
      description: Delete a brand
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: courier-brands.brandsdelete
      with:
        brand_id: tools.brand_id
      outputParameters:
      - type: object
        mapping: $.
