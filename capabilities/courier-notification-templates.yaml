          in: path
          type: string
          description: Notification template ID (`nt_` prefix).
          required: true
        - name: localeId
          in: path
          type: string
          description: Locale code (e.g., `es`, `fr`, `pt-BR`).
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: notifications-id-publish
      path: /notifications/{id}/publish
