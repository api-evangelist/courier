          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: profilesdeletelistsubscription
        method: DELETE
        description: Delete list subscriptions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
