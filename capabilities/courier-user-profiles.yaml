naftiko: 1.0.0-alpha2
info:
  label: Courier — User Profiles
  description: 'Courier — User Profiles. 8 operations. Lead operation: Get a profile. Self-contained Naftiko capability covering
    one Courier business surface.'
  tags:
  - Courier
  - User Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
