      operations:
      - name: profilesget
        method: GET
        description: Get a profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: A unique identifier representing the user associated with the requested profile.
          required: true
      - name: profilescreate
        method: POST
        description: Create a profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: A unique identifier representing the user associated with the requested profile.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: profilesreplace
        method: PUT
        description: Replace a profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: A unique identifier representing the user associated with the requested user profile.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: profilesmergeprofile
        method: PATCH
        description: Update a profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: A unique identifier representing the user associated with the requested user profile.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: profilesdelete
        method: DELETE
        description: Delete a profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_id
          in: path
          type: string
          description: A unique identifier representing the user associated with the requested user profile.
          required: true
    - name: profiles-user_id-lists
      path: /profiles/{user_id}/lists
      operations:
      - name: profilesgetlistsubscriptions
        method: GET
        description: Get list subscriptions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
