naftiko: 1.0.0-alpha2
info:
  label: Courier — Authentication
  description: 'Courier — Authentication. 1 operations. Lead operation: Create a JWT. Self-contained Naftiko capability covering
    one Courier business surface.'
  tags:
  - Courier
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COURIER_API_KEY: COURIER_API_KEY
capability:
  consumes:
  - type: http
    namespace: courier-authentication
    baseUri: https://api.courier.com
    description: Courier — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: auth-issue-token
      path: /auth/issue-token
      operations:
      - name: authtokensissuetoken
        method: POST
        description: Create a JWT
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COURIER_API_KEY}}'
  exposes:
  - type: rest
    namespace: courier-authentication-rest
    port: 8080
    description: REST adapter for Courier — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/auth/issue-token
      name: auth-issue-token
      description: REST surface for auth-issue-token.
      operations:
      - method: POST
        name: authtokensissuetoken
        description: Create a JWT
        call: courier-authentication.authtokensissuetoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: courier-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Courier — Authentication. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-jwt
      description: Create a JWT
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: courier-authentication.authtokensissuetoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
